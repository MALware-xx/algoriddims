<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>READY/ — Purchase access</title><link rel="stylesheet" href="/assets/ready-grid.css"></head><body><main class="page-shell"><section class="hero-grid" style="min-height:70vh"><div class="eyebrow">READY/ · VERIFIED PURCHASE</div><h1>CHECKING YOUR ACCESS.</h1><p id="status">Confirming payment and digital-delivery consent…</p><div id="actions"></div></section></main><script>const sid=new URLSearchParams(location.search).get('session_id'),st=document.getElementById('status'),a=document.getElementById('actions');let tries=0;async function check(){if(!sid){st.textContent='Missing purchase session.';return}tries++;try{const r=await fetch('/api/access?session_id='+encodeURIComponent(sid),{credentials:'same-origin',cache:'no-store'}),j=await r.json();if(r.ok){st.textContent='Purchase verified. Your READY/ plan is available.';a.innerHTML='<a class="button primary" href="'+j.access_url+'">OPEN YOUR PLAN</a>';return}if(r.status===404&&tries<15){setTimeout(check,800);return}throw new Error(j.error||'Access not ready')}catch(e){st.textContent=e.message+'. If payment has just completed, reload this page.'}}check();</script></body></html>
