name: READY OAS static host

on:
  push:
    branches: [ready-oas-host]
    paths:
      - 'ready-oas-host/chunks/**'
      - '.github/workflows/ready-oas-host.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ready-oas-host
      - name: Reconstruct tested READY build
        shell: bash
        run: |
          set -euo pipefail
          cat ready-oas-host/chunks/chunk-* | tr -d '\n\r' | base64 -d > ready-oas-host/ready-dist.tgz
          rm -rf ready-oas-host/dist
          tar -xzf ready-oas-host/ready-dist.tgz -C ready-oas-host
          test -f ready-oas-host/dist/tools/power-dependency-check/index.html
          test -f ready-oas-host/dist/tools/water-72h-calculator/index.html
          test -f ready-oas-host/dist/tools/home-systems-check/index.html
          test -f ready-oas-host/dist/tools/business-downtime-test/index.html
          test "$(find ready-oas-host/dist -type f | wc -l)" -eq 28
      - name: Publish reconstructed files to branch
        shell: bash
        run: |
          git config user.name 'READY release bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -f ready-oas-host/dist ready-oas-host/ready-dist.tgz
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish READY OAS tested static build'
          git push origin HEAD:ready-oas-host
